name: Publish Package

on:
  release:
    types: [published]

permissions:
  id-token: write # Required for npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # setup-node@v7+ avoids writing an empty _authToken that breaks OIDC
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # npm >= 11.5.1 required for trusted publishing
          registry-url: "https://registry.npmjs.org"
          # Never cache package installs for release builds
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Align package version with release tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semver version, optionally prefixed with v (got: ${tag})"
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --access public
